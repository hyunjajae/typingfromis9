# =============================================================================
# Supabase 프로젝트가 잠들지 않게 주기적으로 깨워주는 작업
# =============================================================================
#
# 왜 필요한가요?
#   Supabase 무료 플랜은 "7일 동안 아무도 접속하지 않으면" 프로젝트를
#   일시정지시킵니다. 그러면 랭킹 등록·조회가 안 되고, Supabase 홈페이지에
#   직접 들어가서 Restore 를 눌러야 다시 살아납니다.
#
#   그래서 GitHub 가 대신 매주 월요일·목요일에 랭킹을 한 번 조회해 줍니다.
#   최대 3~4일마다 접속이 생기므로 7일 한도에 걸리지 않습니다.
#   비용은 들지 않습니다.
#
# 직접 실행해 보려면
#   GitHub 저장소 → Actions 탭 → 왼쪽에서 이 작업 선택 → "Run workflow"
#
# ※ 주의: GitHub 는 저장소에 60일 동안 아무 변화가 없으면 이런 예약 작업을
#         자동으로 꺼버립니다. 그때는 메일이 오니, Actions 탭에서 다시 켜주세요.
# =============================================================================

name: Supabase 깨우기

on:
  schedule:
    # 매주 월요일·목요일 새벽 3시(UTC) = 한국시간 낮 12시
    - cron: "0 3 * * 1,4"
  workflow_dispatch:        # 버튼으로 직접 실행할 수도 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 랭킹 한 번 조회해서 깨우기
        run: |
          set -euo pipefail

          CONFIG="data/ranking-config.js"

          # 설정 파일에서 주소와 공개 키를 꺼냅니다
          # (anon key 는 원래 웹사이트에 공개되는 값이라 여기 있어도 안전합니다)
          URL=$(grep -oP 'url:\s*"\K[^"]*' "$CONFIG" || true)
          KEY=$(grep -oP 'anonKey:\s*"\K[^"]*' "$CONFIG" || true)

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::$CONFIG 에 url 또는 anonKey 가 비어 있어 건너뜁니다."
            exit 0
          fi

          # 주소 뒤에 / 나 /rest/v1 이 붙어 있어도 되도록 정리
          BASE="${URL%/}"
          BASE="${BASE%/rest/v1}"

          echo "요청 주소: $BASE/rest/v1/scores"

          CODE=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            "$BASE/rest/v1/scores?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "응답 코드: $CODE"

          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase 응답이 200 이 아닙니다 ($CODE)."
            cat /tmp/out.json || true
            exit 1
          fi

          echo "✅ Supabase 가 깨어 있습니다."
